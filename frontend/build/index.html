<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gem Book — Under Development</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      color: #1a1a1a;
      background:
        radial-gradient(ellipse at 20% 20%, #e8f0e8 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #f0ebe0 0%, transparent 50%),
        linear-gradient(160deg, #f7f5f0 0%, #eae6dc 100%);
    }

    main {
      text-align: center;
      padding: 2rem;
      max-width: 28rem;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 0.75rem;
    }

    p {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #555;
    }

    .status {
      display: inline-block;
      margin-top: 1.5rem;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b7c5e;
    }
  </style>
</head>
<body>
  <main>
    <h1>Gem Book</h1>
    <p>This sample site is under development. Check back soon.</p>
    <span class="status">Coming soon</span>
  </main>
</body>
</html>
