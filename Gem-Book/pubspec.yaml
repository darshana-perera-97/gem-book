name: gem_book
description: GemBook mobile app — Flutter port of the React frontend, matching the mobile UI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.0.2
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1
  video_player: ^2.9.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  path: ^1.9.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/gembook_logo.png
